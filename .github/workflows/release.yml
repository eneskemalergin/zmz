name: Release

# On a vX.Y.Z tag: check the tag against build.zig.zon, CHANGELOG.md, and main, and require main's
# CI to have passed on the tagged commit before anything else runs. Then run the release gate on
# that commit, build the source package and test it as a fresh dependency, and publish a GitHub
# release with the changelog entry as its notes. A draft comes first, so a failed upload or
# attestation can be re-run without a half-published release.

on:
  push:
    tags: ["v*"]
  # To release again by hand, run this workflow with the tag (not a branch) as its ref; from a
  # branch nothing runs.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag, version, notes, and CI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # find main's CI run for the tagged commit
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against build.zig.zon and CHANGELOG.md
        id: version
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the tag must be vX.Y.Z, not ${TAG}"; exit 1; }
          version="$(sed -n 's/^    \.version = "\([^"]*\)",$/\1/p' build.zig.zon)"
          [ "${TAG}" = "v${version}" ] || { echo "::error::${TAG} does not match build.zig.zon's version ${version:-(none)}"; exit 1; }
          grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md needs a dated entry: ## [${version}] - YYYY-MM-DD"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # "ahead" or "identical": main contains the tagged commit.
          status="$(gh api "repos/${GH_REPO}/compare/${GITHUB_SHA}...main" --jq .status)"
          [ "${status}" = ahead ] || [ "${status}" = identical ] ||
            { echo "::error::${TAG} is not on main (main is ${status} of it)"; exit 1; }
      - name: Require main's CI to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # CI starts when main is pushed, so a tag pushed right after may find it still queued or
          # running: wait for it. A commit CI skipped (only Markdown changed) has no run; start one
          # by hand on main, then run this workflow again on the tag.
          started=${SECONDS}
          while :; do
            run="$(gh run list --workflow ci.yml --branch main --commit "${GITHUB_SHA}" --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty | [.status, .conclusion, .url] | @tsv')"
            if [ -z "${run}" ]; then
              (( SECONDS - started < 300 )) ||
                { echo "::error::no CI run on main for ${GITHUB_SHA}; run CI on main by hand, then release again"; exit 1; }
            else
              IFS=$'\t' read -r status conclusion url <<< "${run}"
              if [ "${status}" = completed ]; then
                [ "${conclusion}" = success ] || { echo "::error::CI on main concluded ${conclusion}: ${url}"; exit 1; }
                echo "CI on main passed: ${url}"
                break
              fi
              (( SECONDS - started < 2100 )) || { echo "::error::CI on main is still ${status}: ${url}"; exit 1; }
            fi
            sleep 30
          done

  gate:
    name: Release gate
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/release-gate.yml # zizmor: ignore[self-repository]

  package:
    name: Source package
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-zig
      - name: Build the archive and use it as a dependency
        run: |
          set -euo pipefail
          name="zmz-${VERSION}-source"
          assets="${RUNNER_TEMP}/assets"
          mkdir -p "${assets}"
          # Exactly the tracked files under build.zig.zon's .paths, so the archive holds what
          # `zig fetch` hashes and nothing else.
          paths="$(awk '/^    \.paths = \.\{$/ { inside = 1; next } inside && /^    \},$/ { exit } inside' build.zig.zon |
            sed -n 's/^ *"\([^"]*\)",$/\1/p')"
          [ -n "${paths}" ] || { echo "::error::build.zig.zon lists no .paths"; exit 1; }
          # shellcheck disable=SC2086
          git archive --format=tar.gz --prefix="${name}/" -o "${assets}/${name}.tar.gz" "${GITHUB_SHA}" -- ${paths}

          # A fresh package fetches the archive, never the checkout, then builds and runs the
          # stream example on a test file, as examples/README.md describes.
          consumer="${RUNNER_TEMP}/consumer"
          mkdir -p "${consumer}"
          cd "${consumer}"
          cat > build.zig.zon <<'ZON'
          .{
              .name = .mzml_example,
              .fingerprint = 0x306df90502d2ef18,
              .version = "0.0.0",
              .minimum_zig_version = "0.16.0",
              .dependencies = .{},
              .paths = .{ "build.zig", "build.zig.zon", "main.zig" },
          }
          ZON
          cat > build.zig <<'ZIG'
          const std = @import("std");

          pub fn build(b: *std.Build) void {
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const dependency = b.dependency("zmz", .{ .target = target, .optimize = optimize });
              const executable = b.addExecutable(.{
                  .name = "read-mzml",
                  .root_module = b.createModule(.{
                      .root_source_file = b.path("main.zig"),
                      .target = target,
                      .optimize = optimize,
                      .imports = &.{.{ .name = "zmz", .module = dependency.module("zmz") }},
                  }),
              });
              b.installArtifact(executable);
          }
          ZIG
          cp "${GITHUB_WORKSPACE}/examples/stream.zig" main.zig
          cache="${RUNNER_TEMP}/zig-cache"
          zig fetch --global-cache-dir "${cache}" --save=zmz "${assets}/${name}.tar.gz"
          zig build -Doptimize=ReleaseFast --global-cache-dir "${cache}"
          zig-out/bin/read-mzml "${GITHUB_WORKSPACE}/tests/mzml/data/writer_plain.mzML"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: ${{ runner.temp }}/assets/zmz-${{ env.VERSION }}-source.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, gate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the attestation
      attestations: write # store the attestation
      artifact-metadata: write # link the attestation to the release files
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag still names the verified commit
        run: |
          set -euo pipefail
          tagged="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
          [ "${tagged}" = "${GITHUB_SHA}" ] || { echo "::error::${TAG} moved to ${tagged} during the release"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source
          path: ${{ runner.temp }}/assets
      - name: Write the notes and checksums
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/assets"
          [ "$(find . -maxdepth 1 -type f | wc -l)" -eq 1 ] && [ -s "zmz-${VERSION}-source.tar.gz" ] ||
            { echo "::error::expected only zmz-${VERSION}-source.tar.gz"; exit 1; }
          sha256sum ./*.tar.gz > SHA256SUMS
          # The version's changelog entry, without its heading and the link definitions after it.
          awk -v heading="## [${VERSION}] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found && !/^\[[^]]+\]: / { print }
          ' "${GITHUB_WORKSPACE}/CHANGELOG.md" > "${RUNNER_TEMP}/notes.md"
          grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md" || { echo "::error::the changelog entry is empty"; exit 1; }
      - name: Create or resume the draft release
        run: |
          set -euo pipefail
          if draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "${draft}" = true ] || { echo "::error::${TAG} is already published"; exit 1; }
          else
            gh release create "${TAG}" --draft --verify-tag --title "zmz ${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
          gh release upload "${TAG}" "${RUNNER_TEMP}/assets"/* --clobber
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS
      - name: Publish the release
        run: gh release edit "${TAG}" --draft=false --latest --verify-tag
