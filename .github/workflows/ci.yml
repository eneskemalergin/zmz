name: CI

on:
  push:
    branches: [main, "release/**"]
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "assets/**", "wiki/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.target }} Debug
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-24.04
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-zig
      - name: Format
        if: matrix.target == 'x86_64-linux'
        run: zig fmt --check build.zig src tests tools examples bench
      - name: Test
        run: zig build test --summary all

  citation:
    name: CITATION.cff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
