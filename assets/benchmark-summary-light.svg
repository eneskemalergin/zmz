<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" width="1200" height="336" role="img" aria-labelledby="title desc">
<title id="title">zmz benchmark summary</title>
<desc id="desc">zmz compared with five mzML readers. zmz 221 MB/s, mzdata 130 MB/s, OpenMS 50 MB/s, mzmlpy 28 MB/s, pymzML 23 MB/s, pyteomics 10 MB/s; zmz 2.8 MiB, mzdata 29 MiB, mzmlpy 116 MiB, pyteomics 118 MiB, pymzML 151 MiB, OpenMS 597 MiB; zmz 69 of 69, pyteomics 67 of 69, mzmlpy 65 of 69, OpenMS 64 of 69, pymzML 62 of 69, mzdata 36 of 69.</desc>
<style>.t{font:600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328}.h{font:600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328}.n{font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#59636e}.l,.v{font:400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328}.f{font:400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#59636e}</style>
<rect width="1200" height="336" fill="#ffffff"/>
<text x="24" y="30" class="t">Same files, same work: zmz and five other mzML readers</text>
<text x="438" y="290" class="n">zmz peaks at 3.8 MiB on a 4.0 GB file</text>
